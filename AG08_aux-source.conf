context.modules = [
{   name = libpipewire-module-loopback
    args = {
        node.description = "Yamaha AG08 AUX" # Streaming minus CH7/8. Intended for voice chat applications.
        capture.props = {
            audio.position = [ AUX4 AUX5 ]  #Positions from the hardware
            node.target = "alsa_input.usb-Yamaha_Corporation_Yamaha_AG08-00.pro-input-0"
        }
        playback.props = {
            node.name = "AG08_aux"
            media.class = "Audio/Source"
            audio.channels = 2  # OBS Pipewire plugin won't work without
            audio.position = [ FL FR ]  #Positions for this source
        }
    }
}
]
