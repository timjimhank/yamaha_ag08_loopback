context.modules = [
{   name = libpipewire-module-loopback
    args = {
        node.description = "Yamaha AG08 Voice"
        capture.props = {
            audio.position = [ AUX2 AUX3 ]  #Positions from the hardware
            node.target = "alsa_input.usb-Yamaha_Corporation_Yamaha_AG08-00.pro-input-0"
            stream.dont-remix = true
            node.passive = true
        }
        playback.props = {
            node.name = "AG08_voice"
            media.class = "Audio/Source"
            audio.channels = 2  # OBS Pipewire plugin won't work without
            audio.position = [ FL FR ]  #Positions for this source
        }
    }
}
]
