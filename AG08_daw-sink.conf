context.modules = [
{   name = libpipewire-module-loopback
    args = {
        node.description = "Yamaha AG08 DAW L/R" #Goes direct to Streaming Out
        capture.props = {
            node.name = "AG08_daw"
            media.class = "Audio/Sink"
            audio.channels = 2  # OBS Pipewire plugin won't work without
            audio.position = [ FL FR ]
        }
        playback.props = {
            node.name = "playback.AG08_daw"
            audio.position = [ AUX6 AUX7 ]
            target.object = "alsa_output.usb-Yamaha_Corporation_Yamaha_AG08-00.pro-output-0"
        }
    }
}
]
